name: Deploy

# main → production. DNS decides whether visitors see it; before the cutover
# the site is only reachable on the pull zone's *.b-cdn.net hostname.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Upload site to Bunny Storage
        run: pnpm tsx scripts/deploy-storage.ts
        env:
          BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_HOST: ${{ vars.BUNNY_STORAGE_HOST }}

      - name: Deploy edge script
        run: pnpm tsx scripts/deploy-edge.ts
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_SCRIPT_ID: ${{ vars.BUNNY_SCRIPT_ID }}

      - name: Purge CDN caches
        run: |
          for zone in "$STATIC_PULL_ZONE_ID" "$SITE_PULL_ZONE_ID"; do
            curl --fail-with-body -sS -X POST \
              -H "AccessKey: $BUNNY_API_KEY" \
              "https://api.bunny.net/pullzone/$zone/purgeCache"
          done
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          STATIC_PULL_ZONE_ID: ${{ vars.BUNNY_STATIC_PULL_ZONE_ID }}
          SITE_PULL_ZONE_ID: ${{ vars.BUNNY_SITE_PULL_ZONE_ID }}
